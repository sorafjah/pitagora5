<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;font-family:'BIZ UDPGothic',sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:#bfe3f5;color:#333}
rt{font-size:.55em;font-weight:400}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;font-weight:700;border:0;border-radius:12px;min-width:44px;min-height:44px;cursor:pointer;color:#333}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;pointer-events:none;z-index:11}
#top>*{pointer-events:auto}
#title{font-size:22px;font-weight:700;background:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 2px 0 #0002;white-space:nowrap}
.lv{background:#fff;font-size:15px;padding:0 10px;box-shadow:0 2px 0 #0002;white-space:nowrap}
.lv.on{background:#ffd54a}
#helpBtn{margin-left:auto;width:48px;height:48px;border-radius:50%;font-size:24px;background:#fff;box-shadow:0 2px 0 #0002;flex:none}
#mission{position:fixed;top:62px;left:8px;background:#fffc;border-radius:10px;padding:2px 12px;font-size:16px;font-weight:700;line-height:1.9;max-width:calc(100vw - 16px);pointer-events:none}
#banner{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:8px 14px;
  font-size:19px;font-weight:700;box-shadow:0 3px 0 #0003;display:none;align-items:center;gap:12px;width:max-content;max-width:94vw;line-height:1.7}
#banner.win{background:#fff3b0}#banner.fail{background:#ffe1dc}
#banner button{background:#2e9e5b;color:#fff;font-size:18px;padding:0 14px;white-space:nowrap}
#toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:#333d;color:#fff;border-radius:12px;padding:10px 18px;font-size:18px;font-weight:700;display:none;pointer-events:none;z-index:5}
#panel{position:fixed;left:0;right:0;bottom:0;background:#fffd;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:6px;border-top:2px solid #0001}
#timeRow{display:flex;gap:6px;align-items:center}
#timeRow button{background:#e8eef2;font-size:14px;padding:0 10px;white-space:nowrap}
#timeRow button.on{background:#7fd0ff}
#rotBtn.on{background:#ffd54a!important}
#clearBtn.warn{background:#ffb3a8}
#timeLbl{font-size:14px;font-weight:700;white-space:nowrap}
#time{flex:1;min-width:60px;height:44px;margin:0;accent-color:#e8590c}
#time:disabled{opacity:.3}
#row{display:flex;gap:8px;align-items:stretch}
#cards{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card{background:#f1f5f8;border-radius:12px;padding:6px;border:3px solid transparent}
.card.sel{border-color:#7fd0ff}
.card.bad{border-color:#e03131;animation:pulse .8s infinite alternate}
@keyframes pulse{from{background:#f1f5f8}to{background:#ffd9d4}}
.card h3{margin:0 0 4px;font-size:15px;line-height:1.7;white-space:nowrap;overflow:hidden}
.card h3 b{display:inline-block;background:#333;color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;margin-right:4px;font-size:14px}
.opts{display:flex;gap:4px}
.opts button{flex:1;background:#fff;font-size:14px;padding:0 2px;box-shadow:0 2px 0 #0002;min-height:48px;line-height:1.2}
.opts button small{display:block;font-size:11px;opacity:.6}
.opts button.on{background:#2e9e5b;color:#fff}
#palette{flex:1;display:none;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.pbtn{flex:none;width:86px;height:74px;background:#f1f5f8;box-shadow:0 2px 0 #0002;font-size:12px;line-height:1.2;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pbtn svg{width:48px;height:34px;pointer-events:none}
.pbtn:active{background:#d5e9f5}
.pbtn{position:relative}
.pbtn.new{background:#fff6cc}
.pbtn.new::after{content:'NEW';position:absolute;top:2px;right:3px;background:#e8590c;color:#fff;font-size:10px;border-radius:6px;padding:1px 4px}
#introList{list-style:none;padding:0;margin:8px 0}
#introList li{display:flex;gap:12px;align-items:center;background:#f1f5f8;border-radius:12px;padding:6px 10px;margin-bottom:6px;font-size:17px;line-height:1.8}
#introList li svg{flex:none;width:72px;height:51px;background:#fff;border-radius:8px}
#introList li.goal{background:#fff3b0;font-weight:700}
#introClose{display:block;margin:8px auto 0;background:#2e9e5b;color:#fff;font-size:20px;padding:0 36px;min-height:52px}
#go{width:112px;background:#e8590c;color:#fff;font-size:20px;box-shadow:0 3px 0 #0003;line-height:1.3;flex:none}
#go.stop{background:#555}
#selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:170px;background:#fff;border-radius:14px;padding:6px 8px;box-shadow:0 3px 0 #0003;display:none;gap:6px;align-items:center;max-width:98vw}
#selbar span{font-size:15px;font-weight:700;padding:0 4px;white-space:nowrap}
#selbar button{background:#e8eef2;font-size:16px;padding:0 10px;min-height:48px;min-width:48px;white-space:nowrap}
#selbar #delBtn{background:#ffd9d4}
#selbar #optBtn{background:#d3f0dc}
@media (max-width:1100px){.lv{font-size:13px;padding:0 7px}#title{font-size:18px}}
@media (max-width:900px){#cards{grid-template-columns:repeat(2,1fr)}#go{width:80px;font-size:16px}}
@media (max-width:640px){#title{display:none}#rotBtn,#slowBtn{font-size:12px!important;padding:0 6px!important}.lv{font-size:13px;padding:0 7px}#timeLbl{display:none}#selbar span{display:none}.pbtn{width:74px}}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:64px 12px 12px;z-index:10}
.modal.open{display:flex}
.box{background:#fff;border-radius:18px;padding:14px 18px;max-width:640px;width:100%;max-height:94vh;overflow:auto;-webkit-overflow-scrolling:touch}
.box h2{margin:0 0 6px;font-size:22px;text-align:center}
.box li{font-size:17px;line-height:1.9;margin-bottom:2px}
.box ol{padding-left:0;list-style:none;margin:6px 0}
.box .ic{display:inline-block;width:34px;text-align:center;font-size:20px}
.box svg{width:100%;height:auto;background:#eef7fc;border-radius:12px}
#startBtn{display:block;margin:8px auto 0;background:#e8590c;color:#fff;font-size:22px;padding:0 36px;min-height:56px}
#ver{position:fixed;right:6px;top:58px;font-size:10px;color:#0006;pointer-events:none}

/* ==== スマホ横向き（高さ500px以下）だけに効く調整。iPadには影響しない ==== */
@media (orientation:landscape) and (max-height:500px){
  .modal{padding:58px 12px 8px}
  .box{max-height:calc(100dvh - 66px);padding:8px 16px 0}
  .box h2{font-size:18px;margin-bottom:4px}
  .box svg{max-height:46px}
  .box ol,.box ul{margin:2px 0}
  .box li{font-size:14px;line-height:1.55;margin-bottom:0}
  #startBtn,#introClose{position:sticky;bottom:0;margin:6px auto 0;min-height:48px;box-shadow:0 0 0 8px #fff,-320px 0 0 8px #fff,320px 0 0 8px #fff}
}

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ===== 設定（数値だけ直せば調整できます） =====
const CFG = {
  G: 25,            // 重力
  H: 1/120,         // 物理の1ステップ（秒）
  BALL_R: 0.5,      // 玉の半径（玉の直径＝1 がすべての基準）
  DEPTH: 2.0,       // 部品の奥行き
  RAMP_DH: [0.7, 1.9, 3.4],                 // ①坂：スタートの高さ（ひくい・ふつう・たかい）
  DOMINO: { h:1.8, t:0.24, m:0.4, x0:1.85,  // ②ドミノ：ならべかた（せまい・ふつう・ひろい）
            sets:[{n:6,s:0.6},{n:6,s:1.15},{n:3,s:2.875}] },
  TR_X: 17.05, TR_STEP: 2.3, TR_Y: 8, TR_W: 1.8,   // ③トランポリン：玉が落ちてくる場所と、えらべる位置の間隔
  SPRING_V: [12, 15.5, 18.5], SPRING_ANG: 60,     // ④ばね：つよさ（よわい・ふつう・つよい）と角度
  FUNNEL_Y: 9,      // ⑤てっきんの入口の高さ
  TIME_LIMIT: 40
};
// レベルごとの「正解になる位置」（トランポリンの場所／ばねの強さ）
const LEVELS = [ {tramp:1, spring:1}, {tramp:2, spring:0}, {tramp:0, spring:2} ];

// 物理シミュレーション本体（Node.js でも同じコードで検証できるよう、描画と分けています）
// 動く物体はすべて z 方向の移動と x,y 軸まわりの回転を止めて、奥に落ちないようにしています（遊びやすさ優先のチート）
function createSim(C, lv, ch, eps){
  eps = eps || 0;
  const L = LEVELS[lv], R = CFG.BALL_R, D = CFG.DEPTH, H = CFG.H;
  const world = new C.World(); world.gravity.set(0, -CFG.G*(1+eps), 0);
  world.solver.iterations = 20; world.allowSleep = false;
  const M = {}; ['ball','st','dom','pad','bar'].forEach(k=>M[k]=new C.Material(k));
  const cm=(a,b,f,r)=>world.addContactMaterial(new C.ContactMaterial(M[a],M[b],{friction:f,restitution:r}));
  cm('ball','st',0.5,0.1); cm('ball','dom',0,0.1); cm('dom','dom',0,0); cm('dom','st',0.6,0);
  cm('ball','pad',0.2,0.85); cm('ball','bar',0.4,0.25); cm('ball','ball',0.1,0.5); cm('dom','pad',0.5,0); cm('dom','bar',0.5,0);
  const parts=[], dyn=[], events=[], Z=new C.Vec3(0,0,1);
  function box(x,y,w,h,ang,o){ o=o||{};
    const b=new C.Body({mass:0, material:M[o.mat||'st']});
    b.addShape(new C.Box(new C.Vec3(w/2,h/2,D/2))); b.position.set(x,y,0); b.quaternion.setFromAxisAngle(Z,ang);
    world.addBody(b); const p={x,y,w,h,ang,look:o.look||'wood',idx:o.idx||0,body:b}; parts.push(p); return p; }
  // 上面が (x1,y1)-(x2,y2) を通る板
  function plank(x1,y1,x2,y2,o){ o=o||{}; const th=o.th||0.3, dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy), ang=Math.atan2(dy,dx);
    return box((x1+x2)/2+Math.sin(ang)*th/2, (y1+y2)/2-Math.cos(ang)*th/2, len, th, ang, o); }
  function vwall(x,y1,y2,o){ o=o||{}; return box(x,(y1+y2)/2,o.th||0.3,y2-y1,0,o); }
  function addDyn(b,kind,extra){ b.linearFactor.set(1,1,0); b.angularFactor.set(0,0,1); world.addBody(b);
    const d=Object.assign({body:b,kind},extra||{}); dyn.push(d); return b; }
  function ball(x,y,m,kind){ const b=new C.Body({mass:m, material:M.ball}); b.addShape(new C.Sphere(R)); b.position.set(x,y,0);
    b.linearDamping=0.02; b.angularDamping=0.02; return addDyn(b,kind); }

  // ---- ① 坂と山 ----
  plank(-16,20,-8,16); vwall(-16.15,19.7,21.4);
  plank(-8,16,-6,16); plank(-6,16,-3.5,16.8); plank(-3.5,16.8,-1,16);
  plank(-1,16,10.2,16,{look:'table'});
  const dh=CFG.RAMP_DH[ch[0]], nx=0.4472, ny=0.8944;
  const A=ball(-8-2*dh+nx*R+eps*0.6, 16+dh+ny*R-eps*0.3, 0.5, 'A');
  const rampMarks=CFG.RAMP_DH.map(h=>({x:-8-2*h, y:16+h}));
  // ---- ② ふりことドミノ ----
  const PL=2.65, pivot={x:1.0,y:16.65+PL};
  const anchor=new C.Body({mass:0}); anchor.position.set(pivot.x,pivot.y,0); world.addBody(anchor);
  const bob=new C.Body({mass:1.5, material:M.ball}); bob.addShape(new C.Sphere(R)); bob.position.set(pivot.x,pivot.y-PL,0);
  bob.linearDamping=0.25; addDyn(bob,'bob');
  world.addConstraint(new C.PointToPointConstraint(bob,new C.Vec3(0,PL,0),anchor,new C.Vec3(0,0,0)));
  const ds=CFG.DOMINO, set=ds.sets[ch[1]];
  for(let i=0;i<set.n;i++){ const b=new C.Body({mass:ds.m, material:M.dom});
    b.addShape(new C.Box(new C.Vec3(ds.t/2,ds.h/2,D*0.35))); b.position.set(ds.x0+i*set.s,16+ds.h/2+0.002,0);
    b.addEventListener('collide',e=>{ if(Math.abs(e.contact.getImpactVelocityAlongNormal())>1.2) events.push({k:'tok'}); });
    addDyn(b,'domino',{i}); }
  const BX0=9.4, B=ball(BX0,16+R,1.0,'B');
  bob.addEventListener('collide',e=>{ if(e.body===A && Math.abs(e.contact.getImpactVelocityAlongNormal())>0.8) events.push({k:'clack'}); });
  // ---- ③ すべり台とトランポリン ----
  plank(10.2,16,13.2,14);
  const padX=CFG.TR_X+(ch[2]-L.tramp)*CFG.TR_STEP;
  const pad=plank(padX-CFG.TR_W/2,CFG.TR_Y,padX+CFG.TR_W/2,CFG.TR_Y,{look:'pad',mat:'pad',th:0.4});
  pad.body.addEventListener('collide',e=>{ if(e.body===B) events.push({k:'boing'}); });
  const padSlots=[0,1,2].map(i=>CFG.TR_X+(i-L.tramp)*CFG.TR_STEP);
  // ---- ④ たなとばね ----
  plank(21,10.25,30.5,10,{look:'table'});
  const stop=vwall(30.65,9.7,11.4,{look:'hidden'});
  const LX=30.0, LY=10.0+0.013+R, sa=CFG.SPRING_ANG*Math.PI/180;
  const landX=v=>{ const vy=v*Math.sin(sa), g=CFG.G, dy=CFG.FUNNEL_Y-LY; const t=(vy+Math.sqrt(vy*vy-2*g*dy))/g; return LX+v*Math.cos(sa)*t; };
  // ---- ⑤ てっきんの階段とゴール ----
  const F=landX(CFG.SPRING_V[L.spring]);
  vwall(F-1.65,7.2,9.6); vwall(F+1.65,8.6,11.5);
  const bars=[];
  bars.push(plank(F-1.5,7.6,F+1.5,7.3,{look:'bar',mat:'bar',idx:0}));
  for(let k=1;k<5;k++){ const sx=F+1.6+(k-1)*1.8, sy=7.3-0.8*k; bars.push(plank(sx,sy,sx+1.7,sy-0.18,{look:'bar',mat:'bar',idx:k})); }
  const hit=[0,0,0,0,0];
  bars.forEach((p,k)=>p.body.addEventListener('collide',e=>{ if(e.body===B && !hit[k]){ hit[k]=1; events.push({k:'bar',i:k}); } }));
  const gx=F+8.8, gy=3.1;
  plank(gx-0.2,gy,gx+2.4,gy,{look:'goal'}); vwall(gx+2.55,gy-0.3,gy+2.6,{look:'goal'}); vwall(gx-0.05,gy-0.3,gy+0.7,{look:'goal'});
  plank(F+1.5,11.5,F+15,5.15,{look:'glass',th:0.2});
  const xMax=F+19;
  plank(-22,0,xMax+4,0,{look:'ground',th:1});

  const s={ world, parts, dyn, events, A, B, bob, t:0, steps:0, status:'run', failAt:0, ms:[0,0,0,0,0,0], fired:0,
    info:{ rampMarks, pivot, PL, padSlots, padX, LX, LY, sa, F, gx, gy, xMax,
           signs:[{x:-9,y:22.3},{x:4.5,y:20.6},{x:16.5,y:17},{x:27,y:14.5},{x:F+5,y:13.5}] } };
  let backT=0, tried=false, cupT=0, stillT=0, winT=0, lowT=0, stallT=0;
  const ms=s.ms;

    if(ms[1]&&!ms[2]&&s.t-ms[1]>9) return fail();
    if(s.t>CFG.TIME_LIMIT) return fail();
  };

}

const BOARD = { W: 28, H: 18 };
const NOTE_NAMES = ['ド','レ','ミ','ファ','ソ','ラ','シ','ド'];

const PARTS = {
  ball:   { name:'たま', w:1, h:1, max:3 },
  plankL: { name:'ながい いた', w:6, h:0.3, rot:24, surf:1 },
  plankS: { name:'みじかい いた', w:3, h:0.3, rot:24, surf:1 },
  domino: { name:'ドミノ', w:0.24, h:1.8 },
  tramp:  { name:'トランポリン', w:2.2, h:0.4, rot:24, surf:1 },
  spring: { name:'ばね', w:1.6, h:0.4, rot:24, opt:{ label:'つよさ', names:['よわい','ふつう','つよい'] }, opt0:1 },
  pend:   { name:'ふりこ', w:1.2, h:4, hy:-1.5, lim:6 },
  seesaw: { name:'シーソー', w:5, h:0.3, lim:2, surf:1 },
  spinner:{ name:'かざぐるま', w:4, h:4, opt:{ label:'むき', names:['みぎまわり','ひだりまわり'] } },
  chime:  { name:'てっきん', w:1.8, h:0.25, rot:24, surf:1, opt:{ label:'おと', names:NOTE_NAMES } },
  goal:   { name:'ゴール', w:3.2, h:1.9, hy:0.5, max:1 }

const ANG = k => (k||0)*Math.PI/12;
// 部品 p の上の面の高さ（x の位置で）。のれない部品・急すぎる角度は null
function surfaceAt(p, x){
  const sp=PARTS[p.type]; if(!sp.surf && p.type!=='goal') return null;
  const a=ANG(p.rot), c=Math.cos(a); if(c<0.5) return null;
  let cy=p.y, w=sp.w, th=sp.h; if(p.type==='goal'){ w=2.3; th=0.3; cy=p.y-0.15; }
  if(Math.abs(x-p.x)>w/2*c) return null;
  return { y: cy+(x-p.x)*Math.tan(a)+th/2/c, a };
}
// 玉とドミノは、すぐ下に板があればぴったり乗せる（置きやすくするためのチート）
function settle(layout){
  return layout.map(p=>{ if(p.type!=='ball'&&p.type!=='domino') return {x:p.x,y:p.y};
    const c=[{y:0,a:0}]; for(const q of layout){ const s=surfaceAt(q,p.x); if(s) c.push(s); }
    let best=null;
    for(const s of c){ const off=p.type==='ball'? CFG.BALL_R/Math.cos(s.a) : PARTS.domino.h/2+Math.abs(Math.tan(s.a))*PARTS.domino.w/2;
      const cy=s.y+off+0.003, d=p.y-cy; if(d>-0.6&&d<0.8&&(best===null||cy>best)) best=cy; }
    return {x:p.x, y:best===null?p.y:best}; });
}
function createBuildSim(C, layout, eps){

  layout.forEach((p,pi)=>{ const a=ANG(p.rot), x=pos[pi].x, y=pos[pi].y, o=p.opt||0, wood=p.lock?'locked':'wood';
    if(p.type==='ball'){ const b=new C.Body({mass:1,material:M.ball}); b.addShape(new C.Sphere(R)); b.position.set(x+eps*0.5,y,0); b.linearDamping=0.02; b.angularDamping=0.02;
      b.addEventListener('collide',e=>{ const v=Math.abs(e.contact.getImpactVelocityAlongNormal());

    else if(p.type==='plankL'||p.type==='plankS') box(x,y,PARTS[p.type].w,0.3,a,{look:wood});
    else if(p.type==='domino'){ const d=PARTS.domino, b=new C.Body({mass:0.4,material:M.dom}); b.addShape(new C.Box(new C.Vec3(d.w/2,d.h/2,D*0.35))); b.position.set(x,y,0);
      b.addEventListener('collide',e=>{ if(Math.abs(e.contact.getImpactVelocityAlongNormal())>1.2) events.push({k:'tok'}); }); addDyn(b,'domino',{pi,i:dyn.length}); }

      b.addEventListener('collide',e=>{ if(balls.includes(e.body)) pending.push({ball:e.body,pi,x,y,a,v:CFG.SPRING_BV[o]}); }); }
    else if(p.type==='pend'){ const L=CFG.PEND_L, an=new C.Body({mass:0}); an.position.set(x,y,0); world.addBody(an);
      const b=new C.Body({mass:1.5,material:M.ball}); b.addShape(new C.Sphere(R)); b.position.set(x+L*Math.sin(a),y-L*Math.cos(a),0); b.quaternion.setFromAxisAngle(Z,a); b.linearDamping=0.08; b.collisionFilterGroup=2;

      world.addBody(b); dyn.push({body:b,kind:'spinner',pi}); spinners.push({b,w:o?CFG.SPIN_W:-CFG.SPIN_W}); deco.push({k:'hub',x,y,pi}); slowMovers=true; }
    else if(p.type==='chime'){ const b=box(x,y,1.8,0.25,a,{look:'bar',mat:'bar',idx:o}); let last=-1;
      b.addEventListener('collide',e=>{ if(balls.includes(e.body)&&s.t-last>0.15){ last=s.t; events.push({k:'bar',i:o}); } }); }

    world.step(H); s.t+=H; s.steps++;

function tone(f,dur,type,vol,f2,delay){ if(!AC||AC.state!=='running') return; const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();

  g.gain.setValueAtTime(vol||0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+0.02); }

function playEvent(e, build){
  const n=performance.now();
  if(e.k==='tok'){ if(n-lastTok>45){ lastTok=n; tone(900+Math.random()*300,0.05,'square',0.07); } }
  else if(e.k==='knock'){ if(n-lastKnock>80){ lastKnock=n; tone(150,0.07,'sine',0.2,70); } }
  else if(e.k==='clack') tone(260,0.12,'triangle',0.3,120);
  else if(e.k==='boing') tone(180,0.35,'sine',0.35,520);
  else if(e.k==='spring'){ tone(140,0.3,'sawtooth',0.18,1100); tone(90,0.15,'square',0.15,50); }

  renderer.setAnimationLoop(now=>{ const dt=Math.min((now-last)/1000,1/30); last=now; advance(dt); renderer.render(scene,camera); });
}
let booted=false; const once=()=>{ if(!booted){ booted=true; boot(); } };
(document.fonts&&document.fonts.load?document.fonts.load('700 40px "BIZ UDPGothic"','ピタゴラ５１２３'):Promise.resolve()).then(once,once); setTimeout(once,1500);

</script>
