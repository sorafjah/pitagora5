<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ===== 設定（数値だけ直せば調整できます） =====
const CFG = {
  G: 25,            // 重力
  H: 1/120,         // 物理の1ステップ（秒）
  BALL_R: 0.5,      // 玉の半径（玉の直径＝1 がすべての基準）
  DEPTH: 2.4,       // 部品の奥行き
  RAMP_DH: [0.7, 1.9, 3.4],                 // ①坂：スタートの高さ（ひくい・ふつう・たかい）
  DOMINO: { h:1.8, t:0.24, m:0.4, x0:1.85,  // ②ドミノ：ならべかた（せまい・ふつう・ひろい）
            sets:[{n:6,s:0.6},{n:6,s:1.15},{n:3,s:2.875}] },
  TR_X: 17.05, TR_STEP: 2.3, TR_Y: 8, TR_W: 1.8,   // ③トランポリン：玉が落ちてくる場所と、えらべる位置の間隔
  SPRING_V: [12, 15.5, 18.5], SPRING_ANG: 60,     // ④ばね：つよさ（よわい・ふつう・つよい）と角度
  FUNNEL_Y: 9,      // ⑤てっきんの入口の高さ
  TIME_LIMIT: 40
};
// レベルごとの「正解になる位置」（トランポリンの場所／ばねの強さ）
const LEVELS = [ {tramp:1, spring:1}, {tramp:2, spring:0}, {tramp:0, spring:2} ];

// 物理シミュレーション本体（Node.js でも同じコードで検証できるよう、描画と分けています）
// 動く物体はすべて z 方向の移動と x,y 軸まわりの回転を止めて、奥に落ちないようにしています（遊びやすさ優先のチート）
function createSim(C, lv, ch, eps){
  eps = eps || 0;
  const L = LEVELS[lv], R = CFG.BALL_R, D = CFG.DEPTH, H = CFG.H;
  const world = new C.World(); world.gravity.set(0, -CFG.G*(1+eps), 0);
  world.solver.iterations = 20; world.allowSleep = false;
  const M = {}; ['ball','st','dom','pad','bar'].forEach(k=>M[k]=new C.Material(k));
  const cm=(a,b,f,r)=>world.addContactMaterial(new C.ContactMaterial(M[a],M[b],{friction:f,restitution:r}));
  cm('ball','st',0.5,0.1); cm('ball','dom',0,0.1); cm('dom','dom',0,0); cm('dom','st',0.6,0);
  cm('ball','pad',0.2,0.85); cm('ball','bar',0.4,0.25); cm('ball','ball',0.1,0.5); cm('dom','pad',0.5,0); cm('dom','bar',0.5,0);
  const parts=[], dyn=[], events=[], Z=new C.Vec3(0,0,1);
  function box(x,y,w,h,ang,o){ o=o||{};
    const b=new C.Body({mass:0, material:M[o.mat||'st']});
    b.addShape(new C.Box(new C.Vec3(w/2,h/2,D/2))); b.position.set(x,y,0); b.quaternion.setFromAxisAngle(Z,ang);
    world.addBody(b); const p={x,y,w,h,ang,look:o.look||'wood',idx:o.idx||0,body:b}; parts.push(p); return p; }
  // 上面が (x1,y1)-(x2,y2) を通る板
  function plank(x1,y1,x2,y2,o){ o=o||{}; const th=o.th||0.3, dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy), ang=Math.atan2(dy,dx);
    return box((x1+x2)/2+Math.sin(ang)*th/2, (y1+y2)/2-Math.cos(ang)*th/2, len, th, ang, o); }
  function vwall(x,y1,y2,o){ o=o||{}; return box(x,(y1+y2)/2,o.th||0.3,y2-y1,0,o); }
  function addDyn(b,kind,extra){ b.linearFactor.set(1,1,0); b.angularFactor.set(0,0,1); world.addBody(b);
    const d=Object.assign({body:b,kind},extra||{}); dyn.push(d); return b; }
  function ball(x,y,m,kind){ const b=new C.Body({mass:m, material:M.ball}); b.addShape(new C.Sphere(R)); b.position.set(x,y,0);
    b.linearDamping=0.02; b.angularDamping=0.02; return addDyn(b,kind); }

  // ---- ① 坂と山 ----
  plank(-16,20,-8,16); vwall(-16.15,19.7,21.4);
  plank(-8,16,-6,16); plank(-6,16,-3.5,16.8); plank(-3.5,16.8,-1,16);
  plank(-1,16,10.2,16,{look:'table'});
  const dh=CFG.RAMP_DH[ch[0]], nx=0.4472, ny=0.8944;
  const A=ball(-8-2*dh+nx*R+eps*0.6, 16+dh+ny*R-eps*0.3, 0.5, 'A');
  const rampMarks=CFG.RAMP_DH.map(h=>({x:-8-2*h, y:16+h}));
  // ---- ② ふりことドミノ ----
  const PL=2.65, pivot={x:1.0,y:16.65+PL};
  const anchor=new C.Body({mass:0}); anchor.position.set(pivot.x,pivot.y,0); world.addBody(anchor);
  const bob=new C.Body({mass:1.5, material:M.ball}); bob.addShape(new C.Sphere(R)); bob.position.set(pivot.x,pivot.y-PL,0);
  bob.linearDamping=0.25; addDyn(bob,'bob');
  world.addConstraint(new C.PointToPointConstraint(bob,new C.Vec3(0,PL,0),anchor,new C.Vec3(0,0,0)));
  const ds=CFG.DOMINO, set=ds.sets[ch[1]];
  for(let i=0;i<set.n;i++){ const b=new C.Body({mass:ds.m, material:M.dom});
    b.addShape(new C.Box(new C.Vec3(ds.t/2,ds.h/2,D*0.35))); b.position.set(ds.x0+i*set.s,16+ds.h/2+0.002,0);
    b.addEventListener('collide',e=>{ if(Math.abs(e.contact.getImpactVelocityAlongNormal())>1.2) events.push({k:'tok'}); });
    addDyn(b,'domino',{i}); }
  const BX0=9.4, B=ball(BX0,16+R,1.0,'B');
  bob.addEventListener('collide',e=>{ if(e.body===A && Math.abs(e.contact.getImpactVelocityAlongNormal())>0.8) events.push({k:'clack'}); });
  // ---- ③ すべり台とトランポリン ----
  plank(10.2,16,13.2,14);
  const padX=CFG.TR_X+(ch[2]-L.tramp)*CFG.TR_STEP;
  const pad=plank(padX-CFG.TR_W/2,CFG.TR_Y,padX+CFG.TR_W/2,CFG.TR_Y,{look:'pad',mat:'pad',th:0.4});
  pad.body.addEventListener('collide',e=>{ if(e.body===B) events.push({k:'boing'}); });
  const padSlots=[0,1,2].map(i=>CFG.TR_X+(i-L.tramp)*CFG.TR_STEP);
  // ---- ④ たなとばね ----
  plank(21,10.25,30.5,10,{look:'table'});
  const stop=vwall(30.65,9.7,11.4,{look:'hidden'});
  const LX=30.0, LY=10.0+0.013+R, sa=CFG.SPRING_ANG*Math.PI/180;
  const landX=v=>{ const vy=v*Math.sin(sa), g=CFG.G, dy=CFG.FUNNEL_Y-LY; const t=(vy+Math.sqrt(vy*vy-2*g*dy))/g; return LX+v*Math.cos(sa)*t; };
  // ---- ⑤ てっきんの階段とゴール ----
  const F=landX(CFG.SPRING_V[L.spring]);
  vwall(F-1.65,7.2,9.6); vwall(F+1.65,8.6,11.5);
  const bars=[];
  bars.push(plank(F-1.5,7.6,F+1.5,7.3,{look:'bar',mat:'bar',idx:0}));
  for(let k=1;k<5;k++){ const sx=F+1.6+(k-1)*1.8, sy=7.3-0.8*k; bars.push(plank(sx,sy,sx+1.7,sy-0.18,{look:'bar',mat:'bar',idx:k})); }
  const hit=[0,0,0,0,0];
  bars.forEach((p,k)=>p.body.addEventListener('collide',e=>{ if(e.body===B && !hit[k]){ hit[k]=1; events.push({k:'bar',i:k}); } }));
  const gx=F+8.8, gy=3.1;
  plank(gx-0.2,gy,gx+2.4,gy,{look:'goal'}); vwall(gx+2.55,gy-0.3,gy+2.6,{look:'goal'}); vwall(gx-0.05,gy-0.3,gy+0.7,{look:'goal'});
  plank(F+1.5,11.5,F+15,5.15,{look:'glass',th:0.2});
  const xMax=F+19;
  plank(-22,0,xMax+4,0,{look:'ground',th:1});

  const s={ world, parts, dyn, events, A, B, bob, t:0, steps:0, status:'run', failAt:0, ms:[0,0,0,0,0,0], fired:0,
    info:{ rampMarks, pivot, PL, padSlots, padX, LX, LY, sa, F, gx, gy, xMax,
           signs:[{x:-9,y:22.3},{x:4.5,y:20.6},{x:16.5,y:17},{x:27,y:14.5},{x:F+5,y:13.5}] } };
  let backT=0, tried=false, cupT=0, stillT=0, winT=0, lowT=0, stallT=0;
  const ms=s.ms;
  function fail(){ s.status='fail'; s.failAt=!ms[1]?1:!ms[2]?2:!ms[3]?3:!ms[4]?4:5; events.push({k:'fail'}); }
  function fire(){ const v=CFG.SPRING_V[ch[3]];
    B.position.set(LX,LY+0.03,0); B.velocity.set(v*Math.cos(sa),v*Math.sin(sa),0); B.angularVelocity.set(0,0,-4);
    stop.body.position.y=-200; stop.body.updateAABB && (stop.body.aabbNeedsUpdate=true); s.fired=s.t; events.push({k:'spring'}); }
  s.step=function(){
    if(s.status!=='run') return;
    world.step(H); s.t+=H; s.steps++;
    const a=A.position, b=B.position;
    if(!ms[1]){ if(a.x>-1.2) ms[1]=s.t; else { if(a.x>-5.6) tried=true; if(tried&&a.x<-6.6){ backT+=H; if(backT>0.8) return fail(); } } }
    if(ms[1]&&!ms[2]&&b.x>BX0+0.6) ms[2]=s.t;
    if(ms[2]&&!ms[3]&&b.x>21.6&&b.x<30.5&&b.y>10.3&&b.y<10.95) ms[3]=s.t;
    if(ms[3]&&!s.fired&&b.x>28.3){ B.velocity.x*=0.985; cupT+=H; stillT=(B.velocity.length()<0.3)?stillT+H:0; if(stillT>0.5||cupT>6) fire(); }
    if(s.fired&&!ms[4]&&b.x>F-1.4&&b.x<F+1.4&&b.y<9.0&&b.y>7.6) ms[4]=s.t;
    if(ms[4]&&b.x>gx+0.3&&b.x<gx+2.4&&b.y<gy+1.4){ winT+=H; if(winT>0.2){ ms[5]=s.t; s.status='win'; events.push({k:'win'}); return; } }
    if(b.y<1.2){ lowT+=H; if(lowT>0.7) return fail(); }
    let mx=0; for(const d of dyn){ const v=d.body.velocity.length(); if(v>mx) mx=v; }
    stallT=(mx<0.1&&s.t>0.5)?stallT+H:0;
    if(stallT>1.5&&!(ms[3]&&!s.fired)) return fail();
    if(ms[1]&&!ms[2]&&s.t-ms[1]>9) return fail();
    if(s.t>CFG.TIME_LIMIT) return fail();
  };
  return s;
}


// ===== 見た目・操作の設定 =====
const VIEW = { NEAR_DIST: 21, EDIT_DIST: 25, AZ0: 0.28, EL0: 0.13, SLOW: 0.3, REC_EVERY: 2 };
const GADGETS = [
  { name:'<ruby>坂<rt>さか</rt></ruby>', title:'<ruby>坂<rt>さか</rt></ruby>の <ruby>高<rt>たか</rt></ruby>さ', opts:['ひくい','ふつう','たかい'], num:true },
  { name:'ドミノ', title:'ドミノの ならべ<ruby>方<rt>かた</rt></ruby>', opts:['せまい','ふつう','ひろい'] },
  { name:'トランポリン', title:'トランポリンの <ruby>場所<rt>ばしょ</rt></ruby>', opts:['ひだり','まんなか','みぎ'], num:true },
  { name:'ばね', title:'ばねの <ruby>強<rt>つよ</rt></ruby>さ', opts:['よわい','ふつう','つよい'] },
  { name:'てっきん' } ];
const CIRC = ['①','②','③','④','⑤'];
const $ = id => document.getElementById(id);

const state = { mode:'edit', level:0, choice:[0,0,0,0], paused:true, slow:false, camFar:false, focus:0,
  frames:0, elapsed:0, status:'', failAt:0, viewT:0, cleared:[false,false,false] };
let sim=null, rec=[], recInfo={fired:-1, win:-1, m2:-1}, acc=0;

// ---------- three.js ----------
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xbfe3f5);
const camera=new THREE.PerspectiveCamera(40,1,0.5,500);
scene.add(new THREE.HemisphereLight(0xffffff,0xb9a58a,1.5));

let group=null, dynMesh=[], rod=null, cradle=null, coil=null, flag=null, confetti=[], markSel=null;
const GEO_SPH=new THREE.SphereGeometry(CFG.BALL_R,32,20);
function buildWorld(){
  if(group){ scene.remove(group); group.traverse(o=>{ if(o.geometry&&o.geometry!==GEO_SPH) o.geometry.dispose(); }); }
  group=new THREE.Group(); scene.add(group); dynMesh=[]; confetti=[];

  const I=sim.info, D=CFG.DEPTH;

    const m=add(new THREE.BoxGeometry(p.w,p.h,p.look==='glass'?D*0.9:D),mat,p.x,p.y,0,p.ang,p.look!=='glass');

  add(new THREE.BoxGeometry(I.xMax+26,27,0.4),MAT.board,(I.xMax-22+4)/2,13.3,-D/2-0.35,0,false);
  // 動く物
  for(const d of sim.dyn){ let m;
    if(d.kind==='A'||d.kind==='B') m=add(GEO_SPH,d.kind==='A'?MAT.ballA:MAT.ballB,0,0,0);
    else if(d.kind==='bob') m=add(GEO_SPH,MAT.metal,0,0,0);
    else m=add(new THREE.BoxGeometry(CFG.DOMINO.t,CFG.DOMINO.h,D*0.7),MAT.doms[d.i%6],0,0,0);
    dynMesh.push(m); }
  // ふりこの棒
  rod=new THREE.Group(); rod.position.set(I.pivot.x,I.pivot.y,0); group.add(rod);
  const rm=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,I.PL,8),MAT.metal); rm.position.y=-I.PL/2; rm.castShadow=true; rod.add(rm);
  const peg=add(new THREE.CylinderGeometry(0.22,0.22,D,12),MAT.metal,I.pivot.x,I.pivot.y,-0.2); peg.rotation.x=Math.PI/2;
  // ①坂の目印
  I.rampMarks.forEach((p,i)=>{ const s=label(String(i+1),i===state.choice[0]?'#2e9e5b':'#ffffff',i===state.choice[0]?'#fff':'#333',0.9); s.position.set(p.x-0.75,p.y+2.2,0.5); group.add(s);
    add(new THREE.CylinderGeometry(0.05,0.05,1.0,6),MAT.pole,p.x-0.75,p.y+1.35,-0.9,0,false); });
  // ③トランポリンの目印
  I.padSlots.forEach((x,i)=>{ const on=i===state.choice[2]; if(!on) add(new THREE.BoxGeometry(CFG.TR_W,0.4,D),MAT.ghost,x,CFG.TR_Y-0.2,0,0,false);
    const s=label(String(i+1),on?'#2e9e5b':'#ffffff',on?'#fff':'#333',0.9); s.position.set(x,CFG.TR_Y-1.3,1.3); group.add(s); });
  // ④ばね
  cradle=new THREE.Group(); cradle.position.set(I.LX,10,0); group.add(cradle);
  const seat=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.14,D*0.8),MAT.spring); seat.position.set(-0.1,0.08,0); cradle.add(seat);
  const back=new THREE.Mesh(new THREE.BoxGeometry(0.3,1.5,D*0.8),MAT.spring); back.position.set(0.65,0.75,0); back.castShadow=true; cradle.add(back);
  coil=add(new THREE.CylinderGeometry(0.32,0.32,1,14),MAT.coil,I.LX+0.75,8.9,0);

  // 番号
  I.signs.forEach((p,i)=>{ const s=label(CIRC[i].replace(/[①-⑤]/,String(i+1)),'#333333','#fff',1.7); s.position.set(p.x,p.y,0); group.add(s); });
  // ⑤ゴールの旗と紙ふぶき
  const px=I.gx+2.55, py=I.gy+2.6;
  add(new THREE.CylinderGeometry(0.08,0.08,3.4,8),MAT.pole,px,py+1.7,0);
  flag=add(new THREE.PlaneGeometry(3.6,1.5),new THREE.MeshBasicMaterial({map:TEX.flag,side:THREE.DoubleSide}),px-1.85,py+0.8,0.05,0,false); flag.userData={y0:py+0.8,y1:py+2.6}; flag.visible=false;
  const cg=new THREE.PlaneGeometry(0.3,0.3);
  for(let i=0;i<90;i++){ const m=new THREE.Mesh(cg,new THREE.MeshBasicMaterial({color:BAR_COL[i%5],side:THREE.DoubleSide})); m.visible=false;
    const a=(i*2.399)%6.283, sp=4+(i*7%10)*0.9; m.userData={vx:Math.cos(a)*sp*0.8,vy:8+sp,vz:Math.sin(a)*2,x:I.gx+1.2,y:I.gy+1,r:i}; group.add(m); confetti.push(m); }
  syncBodies(); updateExtras(-1,-1,0);
}
function syncBodies(){ sim.dyn.forEach((d,i)=>{ dynMesh[i].position.copy(d.body.position); dynMesh[i].quaternion.copy(d.body.quaternion); }); syncRod(); }
function syncRod(){ const i=sim.dyn.findIndex(d=>d.kind==='bob'), p=dynMesh[i].position; rod.rotation.z=Math.atan2(p.x-sim.info.pivot.x,-(p.y-sim.info.pivot.y)); }
function record(){ const f=new Float32Array(sim.dyn.length*4); sim.dyn.forEach((d,i)=>{ const p=d.body.position,q=d.body.quaternion; f[i*4]=p.x; f[i*4+1]=p.y; f[i*4+2]=q.z; f[i*4+3]=q.w; }); rec.push(f); }
function applyFrame(n){ const f=rec[Math.max(0,Math.min(rec.length-1,n))]; if(!f) return;
  dynMesh.forEach((m,i)=>{ m.position.set(f[i*4],f[i*4+1],0); m.quaternion.set(0,0,f[i*4+2],f[i*4+3]); }); syncRod(); }
// ばね・旗・紙ふぶきは「発射からの時間」「ゴールからの時間」だけで決まるので、まきもどしても正しく表示されます
function updateExtras(tFire,tWin,now){
  const I=sim.info; let k=0; if(tFire>=0){ const u=tFire; k=u<0.07?u/0.07:Math.max(0,1-(u-0.07)/0.5); }
  const dx=Math.cos(I.sa)*1.1*k, dy=Math.sin(I.sa)*1.1*k; cradle.position.set(I.LX+dx,10+dy,0);
  const top=9.85+dy, len=top-8.1; coil.scale.y=len; coil.position.set(I.LX+0.75+dx*0.5,8.1+len/2,0); coil.rotation.z=-Math.atan2(dx,len);
  const won=tWin>=0; flag.visible=won; if(won){ const u=Math.min(1,tWin/0.9); flag.position.y=flag.userData.y0+(flag.userData.y1-flag.userData.y0)*(1-(1-u)*(1-u)); }
  for(const m of confetti){ const d=m.userData; m.visible=won&&tWin<4; if(m.visible){ m.position.set(d.x+d.vx*tWin,d.y+d.vy*tWin-6*tWin*tWin,d.vz*tWin+0.5); m.rotation.set(tWin*5+d.r,tWin*7+d.r,0); } }
}

// ---------- 音（Web Audio で合成） ----------
let AC=null, lastTok=0;
function audioOn(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function tone(f,dur,type,vol,f2,delay){ if(!AC||AC.state!=='running') return; const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+0.02); }
const NOTES=[523.25,659.25,783.99,1046.5,1318.5];
function playEvent(e){
  if(e.k==='tok'){ const n=performance.now(); if(n-lastTok>45){ lastTok=n; tone(900+Math.random()*300,0.05,'square',0.07); } }
  else if(e.k==='clack') tone(260,0.12,'triangle',0.3,120);
  else if(e.k==='boing') tone(180,0.35,'sine',0.35,520);
  else if(e.k==='spring'){ tone(140,0.3,'sawtooth',0.18,1100); tone(90,0.15,'square',0.15,50); }
  else if(e.k==='bar'){ tone(NOTES[e.i],0.9,'sine',0.3); tone(NOTES[e.i]*2,0.4,'triangle',0.1); }
  else if(e.k==='win'){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,0.3,'triangle',0.22,0,0.25+i*0.13)); }
  else if(e.k==='fail'){ tone(330,0.25,'triangle',0.2,250,0.2); tone(250,0.45,'triangle',0.2,150,0.45); }
}

// ---------- 進行 ----------
function setMode(m){ state.mode=m; const go=$('go');
  go.innerHTML=m==='edit'?'▶<br>スタート':m==='run'?'■<br>とめる':'↺<br>もどす'; go.classList.toggle('stop',m!=='edit');
  const tr=$('time'); tr.disabled=m!=='done'; if(m!=='done'){ tr.max=0; tr.value=0; }
  if(m!=='done'){ $('banner').style.display='none'; document.querySelectorAll('.card').forEach(c=>c.classList.remove('bad')); } }
function toEdit(){ buildWorld(); state.status=''; state.failAt=0; setMode('edit'); }
function start(){ if(state.mode!=='edit') toEdit(); audioOn(); record(); setMode('run'); }
function finish(){ state.status=sim.status; state.failAt=sim.failAt; setMode('done');
  const tr=$('time'); tr.max=rec.length-1; tr.value=rec.length-1;
  const b=$('banner'), bb=$('bannerBtn'); b.style.display='flex'; b.className=sim.status;
  if(sim.status==='win'){ state.cleared[state.level]=true; const last=state.level>=LEVELS.length-1;
    $('bannerTxt').innerHTML=last?'🎉 だいせいこう！ ぜんぶ クリア！':'🎉 だいせいこう！'; bb.innerHTML=last?'レベル1へ':'つぎの レベルへ'; bb.onclick=()=>setLevel(last?0:state.level+1);
  } else { const i=sim.failAt-1; state.focus=Math.min(i,3);
    $('bannerTxt').innerHTML=`ざんねん！ ${CIRC[i]} ${GADGETS[i].name} で うまく いかなかったよ`; bb.innerHTML='なおす'; bb.onclick=toEdit;
    const c=document.querySelectorAll('.card')[Math.min(i,3)]; if(c&&i<4) c.classList.add('bad'); }
  refreshUI(); }
function setChoice(g,i){ state.choice[g]=i; state.focus=g; toEdit(); refreshUI(); }
function setLevel(l){ state.level=l; state.choice=[0,0,0,0]; state.focus=0; toEdit(); refreshUI(); }
function advance(dt){
  state.frames++; state.elapsed+=dt;
  if(state.mode==='run'&&!state.paused){
    acc+=dt*(state.slow?VIEW.SLOW:1); const H=CFG.H;
    while(acc>=H&&sim.status==='run'){ sim.step(); acc-=H; if(sim.steps%VIEW.REC_EVERY===0) record();
      if(sim.fired&&recInfo.fired<0) recInfo.fired=sim.t; if(sim.ms[2]&&recInfo.m2<0) recInfo.m2=sim.t;
      while(sim.events.length) playEvent(sim.events.shift()); }
    state.viewT=sim.t; syncBodies();
    if(sim.status!=='run'){ record(); if(sim.status==='win') recInfo.win=sim.t; while(sim.events.length) playEvent(sim.events.shift()); finish(); }
  }
  if(state.mode==='done'){ const n=+$('time').value, end=rec.length-1;
    // 最後まで見ているときは時間を進めて、旗と紙ふぶきを動かす
    if(n>=end) state.viewT+=dt; else state.viewT=n*CFG.H*VIEW.REC_EVERY; applyFrame(n); }
  if(sim) updateExtras(recInfo.fired>=0&&state.viewT>=recInfo.fired?state.viewT-recInfo.fired:-1, recInfo.win>=0&&state.viewT>=recInfo.win?state.viewT-recInfo.win:-1, state.viewT);
  updateCamera(dt);
}
const SEC_CENTER=()=>[[-9,18.5],[4.5,17.5],[16.5,12.5],[26.5,11.5],[sim.info.F+5,7]];
function updateCamera(dt){
  const I=sim.info, asp=camera.aspect, hf=Math.atan(Math.tan(camera.fov*Math.PI/360)*asp);
  let tx,ty,td;
  if(state.camFar){ tx=(I.xMax-18)/2; ty=11; td=Math.max((I.xMax+22)/2/Math.tan(hf),15/Math.tan(camera.fov*Math.PI/360))*1.02; }
  else if(state.mode==='edit'){ const c=SEC_CENTER()[state.focus]; tx=c[0]; ty=c[1]; td=VIEW.EDIT_DIST/Math.min(1,asp/1.2); }
  else { const useB=recInfo.m2>=0&&state.viewT>=recInfo.m2-0.3; const i=sim.dyn.findIndex(d=>d.kind===(useB?'B':'A')), p=dynMesh[i].position;
    tx=p.x+1.5; ty=Math.max(p.y,3); if(recInfo.win>=0&&state.viewT>=recInfo.win){ tx=I.gx; ty=I.gy+2.2; } td=VIEW.NEAR_DIST/Math.min(1,asp/1.2); }
  const k=1-Math.exp(-dt*(state.mode==='run'?5:4)); cam.x+=(tx-cam.x)*k; cam.y+=(ty-cam.y)*k; cam.dist+=(td-cam.dist)*k;
  const lift=cam.dist*0.13*panelFrac; // 下のパネルにかくれないよう、少し上に見えるようにする
  const ce=Math.cos(cam.el), cy=cam.y-lift;
  camera.position.set(cam.x+cam.dist*Math.sin(cam.az)*ce, cy+cam.dist*Math.sin(cam.el), cam.dist*Math.cos(cam.az)*ce);
  camera.lookAt(cam.x,cy,0);
  sun.target.position.set(cam.x,cam.y,0); sun.position.set(cam.x+10,cam.y+26,24);
}
let panelFrac=1;
function resize(){ const w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  panelFrac=Math.min(2.2,($('panel').offsetHeight/h)/0.22); }
window.addEventListener('resize',resize);

function buildCards(){ const el=$('cards'); el.innerHTML='';
  GADGETS.slice(0,4).forEach((g,gi)=>{ const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<h3><b>${gi+1}</b>${g.title}</h3><div class="opts">${g.opts.map((o,i)=>`<button data-g="${gi}" data-i="${i}">${g.num?`<small>${i+1}</small>`:''}${o}</button>`).join('')}</div>`;
    c.addEventListener('click',e=>{ const b=e.target.closest('button'); audioOn();
      if(b) setChoice(+b.dataset.g,+b.dataset.i); else { state.focus=gi; state.camFar=false; if(state.mode!=='edit') toEdit(); refreshUI(); } });
    el.appendChild(c); }); }
function refreshUI(){
  document.querySelectorAll('.opts button').forEach(b=>b.classList.toggle('on',state.choice[+b.dataset.g]===+b.dataset.i));
  document.querySelectorAll('.card').forEach((c,i)=>c.classList.toggle('sel',state.mode==='edit'&&!state.camFar&&state.focus===i));
  document.querySelectorAll('.lv').forEach(b=>{ const l=+b.dataset.lv; b.classList.toggle('on',l===state.level); b.textContent=(state.cleared[l]?'⭐':'')+'レベル'+(l+1); });
  $('slowBtn').classList.toggle('on',state.slow); $('camBtn').classList.toggle('on',state.camFar); }
$('go').addEventListener('click',()=>{ audioOn(); if(state.mode==='edit') start(); else toEdit(); refreshUI(); });
$('slowBtn').addEventListener('click',()=>{ state.slow=!state.slow; refreshUI(); });
$('camBtn').addEventListener('click',()=>{ state.camFar=!state.camFar; refreshUI(); });
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{ audioOn(); setLevel(+b.dataset.lv); }));
$('helpBtn').addEventListener('click',()=>{ $('help').classList.add('open'); state.paused=true; });

// ---------- テスト用フック ----------
// 動く物体は cannon-es の body.position で動かし、メッシュは毎フレームそこから写しています（まきもどし中は rec[] の記録から写します）
window.__game={ state, camera, cam, CFG, LEVELS, get sim(){return sim;}, get rec(){return rec;}, get bodies(){return sim.dyn;},
  api:{ tick(n,dt){ for(let i=0;i<(n||1);i++) advance(dt||1/60); renderer.render(scene,camera); return this.getState(); },
    getState(){ return {mode:state.mode,level:state.level,choice:state.choice.slice(),status:state.status,failAt:state.failAt,t:sim.t,ms:sim.ms.slice(),frames:state.frames,
      A:{x:sim.A.position.x,y:sim.A.position.y},B:{x:sim.B.position.x,y:sim.B.position.y}}; },
    setChoice, setLevel, start(){ state.paused=false; $('help').classList.remove('open'); start(); refreshUI(); }, reset(){ toEdit(); refreshUI(); },
    scrub(n){ $('time').value=n; },
    simulate(lv,ch){ const s=createSim(CANNON,lv,ch,0); while(s.status==='run') s.step(); return {status:s.status,failAt:s.failAt,t:s.t}; } } };

// ---------- 起動 ----------
function boot(){
  TEX.flag=canvasTex(512,212,(g,w,h)=>{ g.fillStyle='#ffd54a'; g.fillRect(0,0,w,h); g.strokeStyle='#e8590c'; g.lineWidth=14; g.strokeRect(7,7,w-14,h-14);
    g.fillStyle='#333'; g.font='700 96px "BIZ UDPGothic",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('ピタゴラ５',w/2,h/2+6); });
  buildCards(); resize(); toEdit(); refreshUI();
  cam.x=SEC_CENTER()[0][0]; cam.y=SEC_CENTER()[0][1]; cam.dist=VIEW.EDIT_DIST;
  let last=performance.now();
  renderer.setAnimationLoop(now=>{ const dt=Math.min((now-last)/1000,1/30); last=now; advance(dt); renderer.render(scene,camera); });
}
let booted=false; const once=()=>{ if(!booted){ booted=true; boot(); } };
(document.fonts&&document.fonts.load?document.fonts.load('700 40px "BIZ UDPGothic"','ピタゴラ５１２３'):Promise.resolve()).then(once,once); setTimeout(once,1500);
</script>
